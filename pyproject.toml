[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaeevt"
version = "1.0.0"
description = "Physics-informed VAE-EVT for tail-aware radio map prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Amanda Sheron Gamage", email = "asgamage@kth.se" },
    { name = "Niloofar Mehrnia", email = "nilome@kth.se" },
    { name = "James Gross", email = "jamesgr@kth.se" },
]
keywords = ["URLLC", "radio map", "extreme value theory", "VAE", "6G"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "tensorflow>=2.15,<2.21",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Paper = "https://doi.org/PLACEHOLDER"
Dataset = "https://radiomapseer.github.io/"

[project.scripts]
vaeevt-train = "vaeevt.train:main"
vaeevt-evaluate = "vaeevt.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that require TensorFlow and a model build"]
